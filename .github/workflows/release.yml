name: Release theme

# A release is created only after the full WP Integration workflow succeeds on
# main. workflow_dispatch remains available for an explicit/manual release.
on:
  workflow_run:
    workflows: [ "WP Integration" ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: release-theme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            target="$WORKFLOW_SHA"
          else
            target="$DISPATCH_SHA"
          fi
          test -n "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Release target: $target"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          current=$(grep -iE '^[[:space:]]*Version:' style.css | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)
          echo "style.css=${current:-none} latest_tag=${latest_tag:-none}"

          if [ -z "${latest_tag}" ]; then
            next="${current:-1.0.0}"
          else
            higher=$(printf '%s\n%s\n' "$current" "$latest_tag" | sort -V | tail -1)
            if [ -n "$current" ] && [ "$higher" = "$current" ] && [ "$current" != "$latest_tag" ]; then
              next="$current"
            else
              IFS=. read -r MA MI PA <<< "$latest_tag"
              next="${MA}.${MI}.$((PA + 1))"
            fi
          fi

          if ! printf '%s' "$next" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Computed version '$next' is not valid semver" >&2
            exit 1
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build production assets
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s assets/css/main.css
          test -s assets/js/main.js

      - name: Set version and package theme
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" style.css

          rm -rf dist
          mkdir -p dist/bia-learn
          rsync -a ./ dist/bia-learn/ \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'src' --exclude 'dist' --exclude 'docs' \
            --exclude 'tests' --exclude 'vendor' --exclude 'composer.json' \
            --exclude 'composer.lock' --exclude 'phpunit.xml.dist' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'tailwind.config.js' --exclude 'postcss.config.js' \
            --exclude '.gitignore' --exclude '*.log' --exclude '.DS_Store'

          (cd dist && zip -rq bia-learn.zip bia-learn)

      - name: Validate release package
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          unzip -t dist/bia-learn.zip >/dev/null
          unzip -l dist/bia-learn.zip | grep -q 'bia-learn/style.css'
          unzip -l dist/bia-learn.zip | grep -q 'bia-learn/assets/css/main.css'
          unzip -l dist/bia-learn.zip | grep -q 'bia-learn/assets/js/main.js'
          unzip -p dist/bia-learn.zip bia-learn/style.css | grep -qE "^[[:space:]]*Version:[[:space:]]*${NEXT}$"

          if unzip -l dist/bia-learn.zip | grep -Eq 'bia-learn/(node_modules|src|tests|\.github)/'; then
            echo "Development files leaked into release ZIP" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/bia-learn.zip \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --generate-notes
