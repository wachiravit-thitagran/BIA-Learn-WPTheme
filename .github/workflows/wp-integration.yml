name: WP Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration:
    name: "WP Integration (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
      fail-fast: false

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Theme Assets
      run: npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mysqli, curl, dom, xml, mbstring
        tools: wp-cli
        coverage: none

    - name: Install WordPress Core
      run: |
        mkdir -p /tmp/wordpress
        cd /tmp/wordpress
        wp core download --allow-root
        wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
        wp core install --url=http://localhost --title="Test Site" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --allow-root

    - name: Symlink Theme
      run: |
        # Link the current repository to the WordPress themes directory
        ln -s $GITHUB_WORKSPACE /tmp/wordpress/wp-content/themes/bia-learn

    - name: Activate Theme
      run: |
        cd /tmp/wordpress
        wp theme activate bia-learn --allow-root

    - name: Smoke Test - Home Page
      run: |
        cd /tmp/wordpress
        
        # Test loading the home page to ensure no fatal PHP errors
        wp eval '
        ob_start();
        get_header();
        $output = ob_get_clean();
        if (strpos($output, "<html") !== false) {
          echo "Theme loaded successfully.";
        } else {
          echo "Theme failed to load properly.";
          exit(1);
        }
        ' --allow-root
