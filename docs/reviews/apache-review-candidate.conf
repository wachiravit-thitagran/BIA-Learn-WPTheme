# Review candidate only; never loaded by the theme or applied automatically.
# Replace /srv/www/WORDPRESS_ROOT with the actual document root. Merge with the
# existing VirtualHost/ACL after reviewing the source of the observed 403.
# An upstream WAF/rewrite deny also needs its own exact-path exception.

<Directory "/srv/www/WORDPRESS_ROOT/wp-admin">
    <Files "admin-ajax.php">
        AuthMerging Off
        Require all granted
    </Files>
</Directory>

<Directory "/srv/www/WORDPRESS_ROOT">
    <Files "readme.html">
        Require all denied
    </Files>
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
    # HSTS only on HTTPS; no automatic subdomain/preload commitment.
    <If "%{HTTPS} == 'on'">
        Header always set Strict-Transport-Security "max-age=31536000"
    </If>
</IfModule>
